name: pltd_logsheet
description: "PLN Nusa Daya Monitoring"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  flutter_riverpod: ^2.6.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.1.2
  geolocator: ^13.0.2
  permission_handler: ^11.4.0
  connectivity_plus: ^6.1.4
  intl: ^0.20.2
  fl_chart: ^0.69.2
  shimmer: ^3.0.0
  uuid: ^4.5.1
  flutter_map: ^8.2.1
  latlong2: ^0.9.1
  geocoding: ^3.0.0
  google_fonts: ^6.3.2
  pdf: ^3.11.1
  printing: ^5.13.4
  excel: ^4.0.6
  share_plus: ^10.0.2
  go_router: ^17.2.3
  shared_preferences: ^2.5.5
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/PLND.png
  adaptive_icon_background: "#FCE300"
  adaptive_icon_foreground: assets/images/PLND.png
  min_sdk_android: 21
